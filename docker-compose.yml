version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: site-photographie
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SERVER_URL=${NEXT_PUBLIC_SERVER_URL:-http://localhost:3000}
    restart: unless-stopped
    networks:
      - photographie-network
    volumes:
      - ./public:/app/public
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  photographie-network:
    driver: bridge
