services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: site-photographie
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SERVER_URL=${NEXT_PUBLIC_SERVER_URL:-http://localhost:3000}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-focusetlumiere}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - photographie-network
    volumes:
      - ./public:/app/public
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  postgres:
    image: postgres:16-alpine
    container_name: site-photographie-db
    ports:
      # Port hôte 5433 (et pas 5432) pour ne pas entrer en conflit avec une
      # éventuelle installation Postgres native sur la machine. Lié à
      # 127.0.0.1 : accessible depuis l'hôte (npm run dev, un client SQL...)
      # mais jamais exposé publiquement si ce compose tourne sur un serveur.
      - "127.0.0.1:5433:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-focusetlumiere}
    restart: unless-stopped
    networks:
      - photographie-network
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-focusetlumiere}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  photographie-network:
    driver: bridge

volumes:
  pgdata:
